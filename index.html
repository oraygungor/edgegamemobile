<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Edge Master: Mobile AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;900&display=swap');

        :root {
            --alice-bg: #0f172a;
            --bob-bg: #022c22;
            --accent: #a855f7;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: var(--alice-bg);
            color: #e2e8f0; 
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent default browser gestures */
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 1s ease;
        }

        /* Full Screen Canvas */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: grab;
        }
        #gameCanvas:active { cursor: grabbing; }

        /* Floating UI Elements */
        .hud-panel {
            position: absolute;
            z-index: 10;
            backdrop-filter: blur(8px);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Top Status Bar */
        .top-bar {
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            padding: 8px 20px;
            border-radius: 99px;
            max-width: 90%;
        }

        /* Minimal Thinking Line */
        .thinking-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #f43f5e, #a855f7, #3b82f6);
            background-size: 200% 100%;
            animation: gradient-move 1s linear infinite;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
        }
        @keyframes gradient-move { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Settings Toggle (Bottom Right) */
        .fab-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #1e293b;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .fab-btn:active { transform: scale(0.9); }

        /* Settings Modal Overlay */
        #settings-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        #settings-modal.active { transform: translateY(0); }
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }

        /* Selection Screen */
        #selection-screen {
            position: absolute;
            inset: 0;
            background: #020617;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* Overlay Messages */
        #message-overlay {
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #message-overlay.visible { opacity: 1; transform: scale(1); pointer-events: auto; }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(168,85,247,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Thinking Indicator -->
    <div id="thinking-line" class="thinking-line"></div>

    <!-- Canvas Layer -->
    <canvas id="gameCanvas"></canvas>

    <!-- Top Status HUD -->
    <div class="hud-panel top-bar" id="status-hud">
        <div id="turn-indicator" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div class="flex flex-col">
            <span id="status-text" class="text-xs font-bold uppercase tracking-widest text-white">YOUR TURN</span>
            <span id="hint-text" class="text-[10px] text-slate-400 font-mono">Double tap to cut</span>
        </div>
    </div>

    <!-- Bottom Right Settings Button -->
    <button class="fab-btn" onclick="toggleSettings()">
        ⚙️
    </button>

    <!-- Modal Backdrop -->
    <div id="modal-backdrop" class="modal-backdrop" onclick="toggleSettings()"></div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-6"></div>
        
        <div class="space-y-6">
            <!-- Map Size -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-bold text-slate-300">Map Size (N)</label>
                    <span id="n-display" class="text-xs font-mono bg-slate-700 px-2 py-1 rounded text-white">9</span>
                </div>
                <input type="range" id="nRange" min="4" max="12" value="9" oninput="updateN(this.value)">
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="changePlayer()" class="p-4 bg-slate-800 border border-slate-700 rounded-xl text-slate-300 font-bold text-sm hover:bg-slate-700 active:scale-95 transition-all">
                    👤 Change Role
                </button>
                <button onclick="restartGame()" class="p-4 bg-white text-slate-900 rounded-xl font-black text-sm hover:bg-slate-200 active:scale-95 transition-all">
                    ↻ New Game
                </button>
            </div>

            <div class="pt-4 border-t border-slate-700">
                <p class="text-[10px] text-slate-500 text-center">
                    Pinch to Zoom • Drag to Pan • Double Tap Edge
                </p>
            </div>
        </div>
    </div>

    <!-- Victory/Defeat Overlay -->
    <div id="message-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-6">
        <div class="text-center max-w-sm">
            <div id="msg-icon" class="text-6xl mb-4">🏆</div>
            <h1 id="msg-title" class="text-4xl font-black text-white mb-2 tracking-tighter">VICTORY</h1>
            <p id="msg-sub" class="text-slate-400 text-sm mb-8">You outsmarted the machine.</p>
            <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full font-bold text-white shadow-lg active:scale-95 transition-transform">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- Character Selection Screen -->
    <div id="selection-screen">
        <h1 class="text-5xl font-black text-white tracking-tighter mb-8 drop-shadow-lg text-center">EDGE <span class="text-purple-500">MASTER</span></h1>
        
        <div class="flex flex-col gap-4 w-full max-w-xs px-6">
            <button onclick="startGameAs(0)" class="relative p-6 bg-slate-800/80 border border-slate-600 rounded-2xl flex items-center gap-4 hover:border-purple-500 transition-all active:scale-95">
                <div class="text-4xl">👩‍🦰</div>
                <div class="text-left">
                    <div class="font-black text-white">ALICE</div>
                    <div class="text-[10px] text-purple-400 font-bold uppercase">Starts First</div>
                </div>
            </button>
            
            <button onclick="startGameAs(1)" class="relative p-6 bg-slate-800/80 border border-slate-600 rounded-2xl flex items-center gap-4 hover:border-emerald-500 transition-all active:scale-95">
                <div class="text-4xl">🧔</div>
                <div class="text-left">
                    <div class="font-black text-white">BOB</div>
                    <div class="text-[10px] text-emerald-400 font-bold uppercase">Starts Second</div>
                </div>
            </button>
        </div>
    </div>

<script>
/**
 * CORE LOGIC (AI & Game State)
 * Same robust logic as before, optimized for mobile execution
 */

// --- Ghost Brain & MCTS Logic ---
const brain = {
    memory: {},
    load() { try { const d = localStorage.getItem('edge_mobile_v1'); if(d) this.memory = JSON.parse(d); } catch(e){} },
    save() { try { localStorage.setItem('edge_mobile_v1', JSON.stringify(this.memory)); } catch(e){} },
    update(key, val) { 
        if(!this.memory[key]) this.memory[key] = {n:0, w:0}; 
        this.memory[key].n++; this.memory[key].w += val; 
    },
    get(key) { const e = this.memory[key]; return e ? e.w/e.n : null; }
};
brain.load();

class GraphState {
    constructor(n, activeMask = null, degrees = null, edges = null) {
        this.n = n;
        if (activeMask === null) {
            this.edges = []; let idx = 0;
            for (let u = 0; u < n; u++) for (let v = u + 1; v < n; v++) { this.edges.push({ u, v, idx }); idx++; }
            this.num_edges = idx; 
            this.activeMask = (1n << BigInt(this.num_edges)) - 1n;
            this.degrees = new Int8Array(n).fill(n - 1);
        } else {
            this.edges = edges; this.activeMask = activeMask; 
            this.degrees = new Int8Array(degrees); this.num_edges = edges.length;
        }
    }
    clone() { return new GraphState(this.n, this.activeMask, this.degrees, this.edges); }
    getHash(turn) { return `n${this.n}_${this.activeMask.toString()}_t${turn}`; }
    getLegalMoves() {
        const moves = [];
        for (let i = 0; i < this.num_edges; i++) {
            if ((this.activeMask >> BigInt(i)) & 1n) {
                const e = this.edges[i];
                if (this.degrees[e.u] === 1 || this.degrees[e.v] === 1) return [i]; 
                moves.push(i);
            }
        }
        return moves;
    }
    doMove(moveIdx) {
        if (!((this.activeMask >> BigInt(moveIdx)) & 1n)) return false;
        this.activeMask &= ~(1n << BigInt(moveIdx));
        const e = this.edges[moveIdx]; this.degrees[e.u]--; this.degrees[e.v]--;
        return true;
    }
    isTerminal() { for(let i=0; i<this.n; i++) if(this.degrees[i] === 0) return true; return false; }
}

class MCTSNode {
    constructor(move, parent, state, turn) {
        this.move = move; this.parent = parent; this.children = new Map();
        this.wins = 0; this.visits = 0; 
        this.legalMoves = state ? state.getLegalMoves() : [];
        if (state) this.priors = this.calcPriors(state, this.legalMoves);
    }
    calcPriors(state, moves) {
        const map = {}; let sum = 0;
        if (moves.length === 0) return map;
        for (const m of moves) {
            const e = state.edges[m]; 
            const score = Math.pow(state.degrees[e.u] + state.degrees[e.v], 2);
            map[m] = score; sum += score;
        }
        for (const m of moves) map[m] /= (sum || 1);
        return map;
    }
    select() {
        let best = null, max = -Infinity;
        for (const child of this.children.values()) {
            const ucb = (child.visits > 0 ? child.wins/child.visits : 0.5) + 
                        1.25 * (this.priors[child.move]||0) * (Math.sqrt(this.visits)/(1+child.visits));
            if (ucb > max) { max = ucb; best = child; }
        }
        return best;
    }
}

// --- Engine ---
let game = { 
    id: 0, n: 9, 
    state: null, root: null, 
    turn: 0, userRole: 0, 
    history: [], 
    selectedEdge: -1, // For double tap
    nodes: [] 
};

function initGame(n, role) {
    game.id++; game.n = n; game.userRole = role; game.turn = 0;
    game.state = new GraphState(n);
    game.root = new MCTSNode(null, null, game.state, 0);
    game.history = []; game.selectedEdge = -1;
    
    // Layout Nodes (Circle)
    game.nodes = [];
    const r = 400; // Virtual world radius
    for(let i=0; i<n; i++) {
        const ang = (i * 2 * Math.PI / n) - Math.PI/2;
        game.nodes.push({ x: Math.cos(ang)*r, y: Math.sin(ang)*r });
    }
    
    Camera.reset();
    resetUI();
    
    if (game.turn !== game.userRole) setTimeout(aiMove, 600);
}

// AI Runner
async function aiMove() {
    if(game.state.isTerminal()) return;
    setUI('thinking');
    
    const start = performance.now();
    const budget = 600; // ms budget for mobile
    let iters = 0;
    
    // Async loop to not freeze UI
    const runMCTS = () => {
        const batchEnd = performance.now() + 15;
        while(performance.now() < batchEnd) {
            let node = game.root, tempState = game.state.clone(), t = game.turn;
            // Select
            while(node.children.size > 0 && node.legalMoves.length === 0) { 
                node = node.select(); tempState.doMove(node.move); t = 1-t; 
            }
            // Expand
            if(!tempState.isTerminal() && node.legalMoves.length > 0) {
                const m = node.legalMoves.pop();
                const child = new MCTSNode(m, node, tempState, 1-t);
                node.children.set(m, child);
                node = child; tempState.doMove(m); t = 1-t;
            }
            // Rollout
            let simT = t, moves = 0;
            while(!tempState.isTerminal() && moves < 50) {
                const legal = tempState.getLegalMoves();
                if(legal.length===0) break;
                // Heuristic rollout: avoid creating isolated nodes if possible
                let safe = legal.filter(x => { 
                    const e = tempState.edges[x]; 
                    return tempState.degrees[e.u] > 2 && tempState.degrees[e.v] > 2; 
                });
                if (safe.length === 0) safe = legal;
                tempState.doMove(safe[Math.floor(Math.random()*safe.length)]);
                simT = 1-simT; moves++;
            }
            // Backprop
            let result = tempState.isTerminal() ? (simT === game.turn ? 0 : 1) : 0.5;
            while(node) { node.visits++; node.wins += result; result = 1-result; node = node.parent; }
            iters++;
        }
        
        if (performance.now() - start < budget) {
            requestAnimationFrame(runMCTS);
        } else {
            finalizeAIMove();
        }
    };
    runMCTS();
}

function finalizeAIMove() {
    let best = null, max = -1;
    if (game.root.children.size === 0) {
        // Emergency fallback
        const moves = game.state.getLegalMoves();
        if(moves.length > 0) executeMove(moves[0]);
        return;
    }
    for(const c of game.root.children.values()) if(c.visits > max) { max = c.visits; best = c; }
    executeMove(best.move);
}

function executeMove(idx) {
    game.history.push({ h: game.state.getHash(game.turn), p: game.turn });
    game.state.doMove(idx);
    game.selectedEdge = -1; // Reset selection
    
    // Update MCTS tree
    if (game.root.children.has(idx)) {
        game.root = game.root.children.get(idx);
        game.root.parent = null;
    } else {
        game.root = new MCTSNode(null, null, game.state, 1-game.turn);
    }

    game.turn = 1 - game.turn;
    
    if (game.state.isTerminal()) {
        endGame(1 - game.turn); // Previous player made the last move causing 0 degree
    } else {
        setUI(game.turn === game.userRole ? 'player' : 'thinking');
        if (game.turn !== game.userRole) setTimeout(aiMove, 200);
    }
    
    Renderer.triggerFlash(idx);
}

function endGame(winner) {
    // Save to brain
    const winVal = winner === game.userRole ? 0 : 1; // AI pov
    game.history.forEach(h => brain.update(h.h, h.p !== game.userRole ? winVal : 1-winVal));
    brain.save();

    setUI('ended');
    const isWin = winner === game.userRole;
    document.getElementById('msg-title').innerText = isWin ? "VICTORY" : "DEFEAT";
    document.getElementById('msg-title').className = isWin ? "text-4xl font-black text-emerald-400 mb-2" : "text-4xl font-black text-red-500 mb-2";
    document.getElementById('msg-sub').innerText = isWin ? "You are the Edge Master." : "The AI isolated a node.";
    document.getElementById('msg-icon').innerText = isWin ? "🏆" : "💀";
    document.getElementById('message-overlay').classList.add('visible');
}

/**
 * CAMERA & INPUT SYSTEM
 * Handles Touch, Zoom, Pan, Double Tap
 */
const Camera = {
    x: 0, y: 0, zoom: 1,
    minZoom: 0.5, maxZoom: 3,
    reset() { this.x = window.innerWidth/2; this.y = window.innerHeight/2; this.zoom = Math.min(window.innerWidth, window.innerHeight)/1000; },
    toWorld(sx, sy) { return { x: (sx - this.x)/this.zoom, y: (sy - this.y)/this.zoom }; },
    toScreen(wx, wy) { return { x: wx*this.zoom + this.x, y: wy*this.zoom + this.y }; }
};

const Input = {
    lastTap: 0,
    pointers: new Map(),
    dist: 0,
    init() {
        const c = document.getElementById('gameCanvas');
        c.addEventListener('pointerdown', this.down.bind(this));
        c.addEventListener('pointermove', this.move.bind(this));
        c.addEventListener('pointerup', this.up.bind(this));
        c.addEventListener('pointercancel', this.up.bind(this));
        c.addEventListener('wheel', this.wheel.bind(this), {passive: false});
    },
    getDist(p1, p2) { return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY); },
    getCenter() {
        let x=0, y=0, c=0;
        for(let p of this.pointers.values()) { x+=p.clientX; y+=p.clientY; c++; }
        return {x:x/c, y:y/c};
    },
    down(e) {
        this.pointers.set(e.pointerId, e);
        if (this.pointers.size === 2) {
            const arr = Array.from(this.pointers.values());
            this.dist = this.getDist(arr[0], arr[1]);
        }
    },
    move(e) {
        if (!this.pointers.has(e.pointerId)) return;
        const prev = this.pointers.get(e.pointerId);
        
        if (this.pointers.size === 1) {
            // Pan
            Camera.x += e.clientX - prev.clientX;
            Camera.y += e.clientY - prev.clientY;
        } else if (this.pointers.size === 2) {
            // Pinch Zoom
            this.pointers.set(e.pointerId, e); // Update current
            const arr = Array.from(this.pointers.values());
            const newDist = this.getDist(arr[0], arr[1]);
            const center = this.getCenter();
            
            // Zoom toward center
            const factor = newDist / this.dist;
            const newZoom = Math.min(Camera.maxZoom, Math.max(Camera.minZoom, Camera.zoom * factor));
            
            // Adjust pan to zoom into center
            const wx = (center.x - Camera.x) / Camera.zoom;
            const wy = (center.y - Camera.y) / Camera.zoom;
            
            Camera.x = center.x - wx * newZoom;
            Camera.y = center.y - wy * newZoom;
            Camera.zoom = newZoom;
            this.dist = newDist;
        }
        this.pointers.set(e.pointerId, e);
    },
    up(e) {
        // Tap Detection
        if (this.pointers.size === 1 && game.turn === game.userRole) {
            const p = this.pointers.get(e.pointerId);
            const dur = performance.now() - this.lastTap;
            const moveAmt = Math.hypot(e.clientX - p.clientX, e.clientY - p.clientY); // Ensure it wasn't a drag
            
            if (moveAmt < 10) {
                this.handleTap(e.clientX, e.clientY);
            }
        }
        this.pointers.delete(e.pointerId);
        if(this.pointers.size === 0) this.lastTap = performance.now();
    },
    wheel(e) {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        const wx = (e.clientX - Camera.x) / Camera.zoom;
        const wy = (e.clientY - Camera.y) / Camera.zoom;
        Camera.zoom = Math.min(Camera.maxZoom, Math.max(Camera.minZoom, Camera.zoom * factor));
        Camera.x = e.clientX - wx * Camera.zoom;
        Camera.y = e.clientY - wy * Camera.zoom;
    },
    handleTap(sx, sy) {
        const w = Camera.toWorld(sx, sy);
        // Find closest edge
        let best = -1, minD = 40 / Camera.zoom; // Touch tolerance
        
        const s = game.state;
        for (let i = 0; i < s.num_edges; i++) {
            if (!((s.activeMask >> BigInt(i)) & 1n)) continue;
            const u = game.nodes[s.edges[i].u];
            const v = game.nodes[s.edges[i].v];
            const d = distToSegment(w, u, v);
            if (d < minD) { minD = d; best = i; }
        }

        if (best !== -1) {
            // Double Tap Logic
            if (game.selectedEdge === best) {
                executeMove(best);
            } else {
                game.selectedEdge = best;
                Renderer.pulse = 1;
                // Auto deselect after 2s
                setTimeout(() => { if(game.selectedEdge===best) game.selectedEdge = -1; }, 2000);
            }
        } else {
            game.selectedEdge = -1;
        }
    }
};

function distToSegment(p, v, w) {
    const l2 = (v.x-w.x)**2 + (v.y-w.y)**2;
    if (l2 == 0) return Math.hypot(p.x-v.x, p.y-v.y);
    let t = ((p.x-v.x)*(w.x-v.x) + (p.y-v.y)*(w.y-v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (v.x + t*(w.x-v.x)), p.y - (v.y + t*(w.y-v.y)));
}

/**
 * RENDERER
 * Optimized Canvas drawing
 */
const Renderer = {
    canvas: null,
    ctx: null,
    pulse: 0,
    flash: null, // {idx, time, color}
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        if (this.canvas) {
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            this.loop();
        }
    },

    loop() {
        if (!this.ctx || !this.canvas) return;

        this.ctx.fillStyle = game.userRole === 0 ? '#0f172a' : '#022c22';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        if (!game.state) { requestAnimationFrame(()=>this.loop()); return; }

        this.ctx.save();
        this.ctx.translate(Camera.x, Camera.y);
        this.ctx.scale(Camera.zoom, Camera.zoom);
        
        // Draw Edges
        this.ctx.lineCap = 'round';
        const s = game.state;
        for (let i = 0; i < s.num_edges; i++) {
            if (!((s.activeMask >> BigInt(i)) & 1n)) continue;
            const e = s.edges[i];
            const p1 = game.nodes[e.u], p2 = game.nodes[e.v];
            
            this.ctx.beginPath();
            this.ctx.moveTo(p1.x, p1.y);
            this.ctx.lineTo(p2.x, p2.y);
            
            if (i === game.selectedEdge) {
                this.ctx.lineWidth = 8;
                this.ctx.strokeStyle = '#f43f5e';
                this.ctx.shadowColor = '#f43f5e';
                this.ctx.shadowBlur = 10;
            } else {
                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = '#334155';
                this.ctx.shadowBlur = 0;
            }
            this.ctx.stroke();
        }
        
        // Flash animation for last move
        if (this.flash && (Date.now() - this.flash.time < 500)) {
            const e = s.edges[this.flash.idx] || {u:0, v:0}; // fallback if edge gone, but actually edges persist just mask changes. Wait, my GraphState keeps edge definitions
            // Oh, edges array is constant. 
            const edgeDef = s.edges[this.flash.idx];
            if(edgeDef) {
                const p1 = game.nodes[edgeDef.u], p2 = game.nodes[edgeDef.v];
                this.ctx.beginPath(); this.ctx.moveTo(p1.x, p1.y); this.ctx.lineTo(p2.x, p2.y);
                this.ctx.lineWidth = 6;
                this.ctx.strokeStyle = this.flash.color;
                this.ctx.globalAlpha = 1 - (Date.now() - this.flash.time)/500;
                this.ctx.stroke();
                this.ctx.globalAlpha = 1;
            }
        }

        // Draw Nodes
        this.ctx.shadowBlur = 0;
        for(let i=0; i<game.n; i++) {
            const p = game.nodes[i];
            const d = s.degrees[i];
            
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 25, 0, Math.PI*2);
            
            if (d === 1) { this.ctx.fillStyle = '#ef4444'; }
            else if (d === 2) { this.ctx.fillStyle = '#eab308'; }
            else { this.ctx.fillStyle = '#3b82f6'; }
            
            this.ctx.fill();
            this.ctx.strokeStyle = '#1e293b';
            this.ctx.lineWidth = 4;
            this.ctx.stroke();
            
            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 16px Inter';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(d, p.x, p.y);
        }

        this.ctx.restore();
        requestAnimationFrame(()=>this.loop());
    },
    resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    },
    triggerFlash(idx) {
        this.flash = { idx, time: Date.now(), color: game.turn === 0 ? '#a855f7' : '#10b981' }; // color of player who JUST moved (which is now prev turn)
        // Wait, executeMove flips turn. So if Alice (0) moved, turn is now 1. 
        // We want the color of the move just made. 
        this.flash.color = (game.turn === 1) ? '#a855f7' : '#10b981';
    }
};

/**
 * UI CONTROLLERS
 */
function setUI(state) {
    const statusText = document.getElementById('status-text');
    const hintText = document.getElementById('hint-text');
    const turnInd = document.getElementById('turn-indicator');
    const thinkLine = document.getElementById('thinking-line');
    
    if (state === 'thinking') {
        statusText.innerText = "AI THINKING";
        statusText.className = "text-xs font-bold uppercase tracking-widest text-purple-400";
        hintText.innerText = "Please wait...";
        turnInd.className = "w-3 h-3 rounded-full bg-purple-500 animate-pulse";
        thinkLine.style.opacity = 1;
    } else if (state === 'player') {
        statusText.innerText = "YOUR TURN";
        statusText.className = "text-xs font-bold uppercase tracking-widest text-emerald-400";
        hintText.innerText = "Double tap edge to cut";
        turnInd.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
        thinkLine.style.opacity = 0;
    } else {
        thinkLine.style.opacity = 0;
    }
}

function toggleSettings() {
    const m = document.getElementById('settings-modal');
    const b = document.getElementById('modal-backdrop');
    if (m.classList.contains('active')) {
        m.classList.remove('active');
        b.classList.remove('active');
    } else {
        m.classList.add('active');
        b.classList.add('active');
    }
}

function updateN(val) {
    document.getElementById('n-display').innerText = val;
}

function startGameAs(role) {
    document.getElementById('selection-screen').style.opacity = 0;
    setTimeout(() => {
        document.getElementById('selection-screen').style.display = 'none';
        initGame(9, role);
    }, 500);
}

function changePlayer() {
    toggleSettings();
    document.getElementById('selection-screen').style.display = 'flex';
    setTimeout(()=>document.getElementById('selection-screen').style.opacity = 1, 50);
}

function restartGame() {
    document.getElementById('message-overlay').classList.remove('visible');
    const n = parseInt(document.getElementById('nRange').value);
    toggleSettings();
    // if modal was open, it closes. If triggered from overlay, toggleSettings closes nothing (harmless) or opens it? 
    // Wait, toggleSettings checks class. 
    // Force close modal
    document.getElementById('settings-modal').classList.remove('active');
    document.getElementById('modal-backdrop').classList.remove('active');
    
    initGame(n, game.userRole);
}

function resetUI() {
    document.getElementById('message-overlay').classList.remove('visible');
}

// Init
window.addEventListener('resize', () => Renderer.resize());
Renderer.init();
Input.init();
</script>
